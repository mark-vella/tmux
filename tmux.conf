source-file ~/.config/tmux/tmux.reset.conf

set -g history-limit 5000     # increase history size (from 2,000)
set -a terminal-features "tmux-256color:RGB"
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi

source-file ~/.config/tmux/tmux.style.conf

# Sync Omarchy's palette when available; other systems keep their terminal colours.
run-shell -b 'if command -v omarchy >/dev/null 2>&1; then omarchy theme set tmux; fi'
